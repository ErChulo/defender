<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DEFENDER — an arcade tribute</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { background:#000; -webkit-user-select:none; user-select:none; }
  #game { display:block; width:100vw; height:100vh; background:#000; }
  /* extremely subtle scanlines only — background stays pure #000 */
  #fx {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 3px);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fx"></div>
<script>
"use strict";
/* =========================================================================
   DEFENDER — an arcade tribute to the 1981 classic
   Original code, original vector sprites, synthesized audio (Web Audio API).
   Palette/feel tuned to match reference screenshots (pure #000 background).
   ========================================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const HUD_H = 46;
const SCANNER_H = 84;
let GROUND_BASE = 0;
let PLAY_TOP = HUD_H;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  GROUND_BASE = H - SCANNER_H - 2;
  PLAY_TOP = HUD_H;
  buildStars();
}
window.addEventListener('resize', resize);

// --------------------------- Constants (feel) ----------------------------
const TAU = Math.PI * 2;
const WORLD_W = 3600;
const CRUISE = 286;          // retained for hyperspace/legacy tuning
const H_ACCEL = 1850;         // direct horizontal thrust acceleration
const H_MAX = 560;
const H_DAMP = 4.2;
const REV_ACCEL = 3.0;       // retained for the optional reverse helper
const V_ACCEL = 2100;         // direct vertical thrust acceleration
const V_MAX = 560;
const V_DAMP = 4.8;
const LASER_SPEED = 860;
const LASER_RATE = 0.095;
const SHIP_R = 14;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function chance(p) { return Math.random() < p; }
function wrap(v, m) { v = v % m; return v < 0 ? v + m : v; }
function wrapDist(a, b) { let d = a - b; d = ((d % WORLD_W) + WORLD_W) % WORLD_W; if (d > WORLD_W / 2) d -= WORLD_W; return d; }
function approach(cur, target, rate, dt) { return cur + (target - cur) * Math.min(1, rate * dt); }

// Sharp jagged mountains; periodic over WORLD_W so the world wraps seamlessly.
function terrainTop(x) {
  x = wrap(x, WORLD_W);
  let n = Math.sin(x * TAU * 3 / WORLD_W) * 1.0
        + Math.sin(x * TAU * 7 / WORLD_W + 1.7) * 0.55
        + Math.sin(x * TAU * 15 / WORLD_W + 2.3) * 0.30
        + Math.sin(x * TAU * 31 / WORLD_W + 0.4) * 0.14;
  n = Math.sign(n) * Math.pow(Math.abs(n), 0.78);
  const peak = (n + 2.0) / 4.0;
  return GROUND_BASE - 14 - peak * 178;
}

// --------------------------- Audio (synthesized originals) ---------------
// Layered oscillators, filtered noise, bass transients and a compressor make
// the effects much denser than a single-chip blip while remaining original.
const Sound = (() => {
  let ac = null, master = null, compressor = null, noiseBuf = null, enabled = true;
  const MASTER_LEVEL = 0.42;
  function init() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = enabled ? MASTER_LEVEL : 0;
      const lowShelf = ac.createBiquadFilter(); lowShelf.type = 'lowshelf';
      lowShelf.frequency.value = 130; lowShelf.gain.value = 8.5;
      const airShelf = ac.createBiquadFilter(); airShelf.type = 'highshelf';
      airShelf.frequency.value = 4200; airShelf.gain.value = 2.5;
      compressor = ac.createDynamicsCompressor();
      compressor.threshold.value = -24; compressor.knee.value = 18;
      compressor.ratio.value = 8; compressor.attack.value = 0.003; compressor.release.value = 0.16;
      master.connect(lowShelf).connect(airShelf).connect(compressor).connect(ac.destination);
      const len = Math.floor(ac.sampleRate * 1.6);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume(); }
  function tone(freq, dur, type, vol, slideTo, delay, detune) {
    if (!ac || !enabled) return;
    type = type || 'square'; vol = vol == null ? 0.16 : vol; delay = delay || 0; detune = detune || 0;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = type; o.detune.value = detune;
    o.frequency.setValueAtTime(Math.max(1, freq), t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.012, dur * 0.18));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.04);
  }
  function noise(dur, vol, lpStart, lpEnd, delay, hpStart, band) {
    if (!ac || !enabled) return;
    delay = delay || 0; hpStart = hpStart || 35;
    const t0 = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.setValueAtTime(hpStart, t0);
    const f = ac.createBiquadFilter(); f.type = band ? 'bandpass' : 'lowpass';
    f.frequency.setValueAtTime(lpStart, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(45, lpEnd), t0 + dur);
    if (band) f.Q.value = 0.8;
    const g = ac.createGain(); g.gain.setValueAtTime(Math.max(0.0001, vol), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(hp).connect(f).connect(g).connect(master); s.start(t0); s.stop(t0 + dur + 0.04);
  }
  function bass(freq, dur, vol, slideTo, delay) {
    tone(freq, dur, 'sine', vol, slideTo, delay);
    tone(freq * 2.01, dur * 0.78, 'triangle', vol * 0.34, slideTo ? slideTo * 1.8 : null, (delay || 0) + 0.004, -7);
  }
  function sub(freq, dur, vol, slideTo, delay) {
    // Separate infrabass layer: the compressor keeps it punchy without clipping.
    tone(freq, dur, 'sine', vol, slideTo, delay);
    tone(freq * 1.49, dur * 0.72, 'sine', vol * 0.22, slideTo ? slideTo * 1.49 : null, (delay || 0) + 0.006, 4);
  }
  return {
    init, resume,
    setEnabled(v){ enabled = v; if (master) master.gain.value = v ? MASTER_LEVEL : 0; },
    isEnabled(){ return enabled; },
    laser(){
      tone(1650, 0.095, 'square', 0.16, 330, 0, -8);
      tone(2460, 0.055, 'sawtooth', 0.075, 820, 0.004, 5);
      tone(790, 0.11, 'triangle', 0.085, 180, 0.002, 4);
      noise(0.055, 0.11, 7600, 1200, 0, 1800, true);
    },
    enemyShot(){
      tone(430, 0.20, 'sawtooth', 0.15, 82);
      tone(215, 0.24, 'square', 0.075, 54, 0, -8);
      noise(0.10, 0.075, 1900, 180, 0, 120, true);
    },
    explosion(big){
      const d = big ? 1.08 : 0.68;
      // Impact stack: infrabass thump, bass body, mid crack, high debris.
      sub(big ? 32 : 43, big ? 1.16 : 0.76, big ? 0.68 : 0.46, big ? 17 : 24);
      bass(big ? 58 : 86, big ? 0.92 : 0.58, big ? 0.46 : 0.34, big ? 23 : 35);
      tone(big ? 132 : 188, big ? 0.62 : 0.36, 'sawtooth', big ? 0.20 : 0.14, big ? 36 : 52, 0.006, -5);
      noise(d, big ? 0.76 : 0.56, 10500, 46, 0, 24);
      noise(big ? 0.62 : 0.40, big ? 0.34 : 0.25, 3000, 100, 0.012, 150, true);
      tone(big ? 860 : 1180, 0.18, 'square', 0.11, 150, 0.008);
      tone(big ? 2400 : 3000, 0.07, 'sawtooth', 0.055, 700, 0.016);
    },
    smartBomb(){
      sub(28, 1.28, 0.78, 16);
      bass(54, 1.10, 0.52, 20);
      tone(118, 0.96, 'sawtooth', 0.19, 28, 0.015);
      noise(1.22, 0.78, 13000, 38, 0, 22);
      noise(0.86, 0.36, 3600, 72, 0.01, 80, true);
      tone(620, 0.72, 'square', 0.12, 80, 0.03);
      tone(1400, 0.44, 'triangle', 0.09, 105, 0.08);
    },
    mutation(){
      bass(145, 0.34, 0.20, 510);
      tone(280, 0.25, 'sawtooth', 0.12, 940, 0.05);
      tone(1180, 0.19, 'square', 0.09, 250, 0.21);
      noise(0.16, 0.07, 4800, 900, 0.06, 500, true);
    },
    pickup(){
      tone(620, 0.11, 'square', 0.15, 920);
      tone(930, 0.10, 'triangle', 0.10, 1320, 0.07);
      tone(1320, 0.14, 'square', 0.13, null, 0.14, -5);
      noise(0.06, 0.045, 5200, 1800, 0.08, 900, true);
    },
    hyperspace(){
      noise(0.48, 0.17, 10000, 700, 0, 900, true);
      for (let i = 0; i < 9; i++) {
        tone(300 + i * 125, 0.075, i % 2 ? 'square' : 'sawtooth', 0.105, 760 + i * 70, i * 0.032, i % 2 ? 7 : -7);
      }
      bass(90, 0.34, 0.16, 520, 0.08);
    },
    reverse(){
      tone(620, 0.075, 'square', 0.10, 290);
      tone(310, 0.10, 'sawtooth', 0.065, 150, 0.006);
      noise(0.045, 0.05, 4800, 900, 0, 700, true);
    },
    save(){
      const notes = [523, 659, 784, 1047];
      notes.forEach((n, i) => { tone(n, 0.12, i % 2 ? 'triangle' : 'square', 0.14, n * 1.03, i * 0.085); tone(n / 2, 0.15, 'sine', 0.07, n / 2, i * 0.085); });
      noise(0.14, 0.045, 6200, 1400, 0.16, 900, true);
    },
    death(){
      sub(35, 1.24, 0.68, 18);
      bass(74, 1.00, 0.40, 26);
      tone(178, 0.88, 'sawtooth', 0.18, 38, 0.02);
      noise(1.14, 0.65, 9500, 42, 0, 24);
      noise(0.72, 0.28, 2100, 90, 0.02, 70, true);
      tone(1180, 0.38, 'square', 0.085, 105, 0.04);
    },
    waveStart(){
      bass(98, 0.30, 0.15, 120);
      [392, 523, 659, 784].forEach((n, i) => {
        tone(n, i === 3 ? 0.28 : 0.14, i % 2 ? 'triangle' : 'square', 0.14, n * 1.02, i * 0.12);
      });
      noise(0.18, 0.05, 6500, 1200, 0.24, 700, true);
    },
    extraLife(){
      [659, 784, 988, 1319].forEach((n, i) => {
        tone(n, 0.12, 'square', 0.14, n * 1.04, i * 0.09);
        tone(n / 2, 0.16, 'sine', 0.08, n / 2, i * 0.09);
      });
      noise(0.22, 0.05, 7200, 1500, 0.26, 1000, true);
    },
    baiter(){
      bass(126, 0.62, 0.19, 72);
      tone(310, 0.52, 'sawtooth', 0.11, 170, 0.02);
      tone(620, 0.32, 'square', 0.07, 300, 0.08);
      noise(0.24, 0.055, 4200, 500, 0.04, 250, true);
    },
    land(){
      bass(185, 0.12, 0.13, 105);
      tone(370, 0.10, 'triangle', 0.09, 190, 0.005);
      noise(0.05, 0.035, 2600, 500, 0, 120, true);
    }
  };
})();

// --------------------------- Input ---------------------------------------
// Direct four-way flight: the arrows apply acceleration, and releasing them
// lets the ship coast down instead of snapping to a fixed screen position.
const keys = { left:false, right:false, up:false, down:false, fire:false };
let fireCooldown = 0;
function setKey(e, down) {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': keys.left = down; e.preventDefault(); return true;
    case 'ArrowRight': case 'KeyD': keys.right = down; e.preventDefault(); return true;
    case 'ArrowUp': case 'KeyW': keys.up = down; e.preventDefault(); return true;
    case 'ArrowDown': case 'KeyS': keys.down = down; e.preventDefault(); return true;
    case 'Space': keys.fire = down; e.preventDefault(); return true;
  }
  return false;
}
window.addEventListener('keydown', function (e) {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (setKey(e, true)) return;
  if (e.repeat) return;
  switch (e.code) {
    case 'KeyB': case 'ShiftLeft': case 'ShiftRight': smartBomb(); break;
    case 'KeyH': case 'KeyC': hyperspace(); break;
    case 'KeyP': case 'Escape': togglePause(); break;
    case 'KeyM': Sound.setEnabled(!Sound.isEnabled()); break;
    case 'KeyF': toggleFullscreen(); break;
    case 'Enter': confirm(); break;
  }
});
window.addEventListener('keyup', function (e) { setKey(e, false); });
function toggleFullscreen() {
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
}
canvas.addEventListener('click', function(){ Sound.resume(); confirm(); });

// --------------------------- Game state ----------------------------------
const STATE = { TITLE:'title', INTRO:'intro', PLAY:'play', DEAD:'dead', GAMEOVER:'gameover' };
let state = STATE.TITLE;
let stateTimer = 0;

let score = 0, hi = 0, lives = 3, wave = 1, bombs = 3;
let nextExtra = 15000;
let rescuedThisWave = 0;
let waveTime = 0;
let planetDestroyed = false;
let shake = 0, flash = 0, flashColor = '#fff';
let bannerText = '', bannerSub = '';

try { hi = parseInt(localStorage.getItem('defenderHi') || '0', 10) || 0; } catch(e){}

const ship = { x: WORLD_W * 0.5, y: 0, vx: 0, vy: 0, facing: 1, carrying: null, invuln: 2.0, alive: true, thrust: 0 };
// World coordinate at the center of the viewport. The camera has a wide
// dead-zone so the ship can visibly travel across the screen instead of
// being pinned to an edge or glued to the exact center.
let camX = WORLD_W * 0.5;
let shots = [], eshots = [], enemies = [], humanoids = [], mines = [], particles = [], floats = [], stars = [];

function buildStars() {
  stars = [];
  const n = Math.floor((W * H) / 8500);
  for (let i = 0; i < n; i++) {
    stars.push({ x: Math.random() * WORLD_W, y: Math.random() * (H - SCANNER_H), b: rand(0.25, 1), s: rand(0.4, 1.7), tw: Math.random() * TAU });
  }
}

// Fireball explosion: yellow core -> orange -> red, plus a shockwave ring.
const FIRE = ['#fff8b0', '#ffe040', '#ffb02a', '#ff5a1a', '#d83010'];
function explosion(x, y, tint, count, power) {
  count = count || 14; power = power || 1; tint = tint || '#fff';
  particles.push({ ring:true, x, y, r:4, maxr: 50 * power, life: 0.36, max: 0.36, color: tint });
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, sp = rand(40, 270) * power;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.85), max: 0.85, color: pick(FIRE), size: rand(2, 4.6) });
  }
  for (let i = 0; i < count / 2; i++) {
    const a = Math.random() * TAU, sp = rand(80, 380) * power;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.1, 0.3), max: 0.3, color: '#fff', size: rand(1, 2.2) });
  }
  for (let i = 0; i < count / 2; i++) {
    const a = Math.random() * TAU, sp = rand(50, 220) * power;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.2, 0.55), max: 0.55, color: tint, size: rand(1.5, 3) });
  }
}

// Player death uses the sparse white pixel starburst seen in the arcade
// reference, rather than the colored fireball used for enemy destruction.
function playerExplosion(x, y) {
  const white = ['#ffffff', '#ffffff', '#eaffff', '#c9faff', '#ffffff'];
  for (let i = 0; i < 84; i++) {
    const a = Math.random() * TAU;
    const sp = rand(70, 430) * (chance(0.35) ? 0.62 : 1);
    particles.push({
      x: x + rand(-3, 3), y: y + rand(-3, 3),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.42, 1.35), max: 1.35,
      color: pick(white), size: rand(1.1, 2.8)
    });
  }
  // A few colored sprite fragments remain among the white pixels.
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * TAU, sp = rand(90, 330);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.9), max: 0.9,
      color: pick(['#f020d0', '#ffb52d', '#ff5a38']), size: rand(1.4, 2.6)
    });
  }
}
function addFloat(x, y, text, color) { floats.push({ x, y, text, color: color || '#fff', life: 1.0, max: 1.0 }); }
function screenShake(a) { shake = Math.max(shake, a); }

// Arcade-faithful palette (from reference screenshots)
const COLORS = { lander:'#9aff2e', mutant:'#f020d0', bomber:'#ffe020', pod:'#e040e0', swarmer:'#ff9a2a', baiter:'#ff4848' };

function makeEnemy(type, x, y) {
  const e = { type, x, y, vx: 0, vy: 0, hp: 1, r: 15, t: Math.random() * TAU,
              fireTimer: rand(0.8, 2.4), carrying: null, wobble: rand(0, TAU), state: 'roam', target: null, mineTimer: 0 };
  switch (type) {
    case 'lander': e.r = 15; e.speed = 66; break;
    case 'mutant': e.r = 13; e.speed = 222; e.fireTimer = rand(1.0, 2.0); break;   // fast, aggressive alien
    case 'bomber': e.r = 15; e.speed = 104; e.mineTimer = rand(1.5, 3); break;
    case 'pod': e.r = 20; e.speed = 82; break;
    case 'swarmer': e.r = 7; e.speed = 262; break;
    case 'baiter': e.r = 13; e.speed = 312; e.fireTimer = rand(0.6, 1.1); break;
  }
  return e;
}

function spawnWave(n) {
  enemies = []; eshots = []; shots = []; mines = []; particles = []; floats = [];
  humanoids = []; planetDestroyed = false; waveTime = 0; rescuedThisWave = 0; ship.carrying = null;
  const speedMul = 1 + (n - 1) * 0.10;
  const landers = 5 + n;
  const bombers = Math.max(0, n - 1);
  const pods = n >= 3 ? Math.floor((n - 1) / 2) : 0;
  const place = (type) => {
    let x; do { x = Math.random() * WORLD_W; } while (Math.abs(wrapDist(x, ship.x)) < 520);
    const e = makeEnemy(type, x, rand(PLAY_TOP + 40, GROUND_BASE - 190));
    e.speed *= speedMul; enemies.push(e);
  };
  for (let i = 0; i < landers; i++) place('lander');
  for (let i = 0; i < bombers; i++) place('bomber');
  for (let i = 0; i < pods; i++) place('pod');
  const hcount = 8;
  for (let i = 0; i < hcount; i++) {
    const x = (i + 0.5) * (WORLD_W / hcount) + rand(-80, 80);
    humanoids.push({ x, y: terrainTop(x) - 11, vx: chance(0.5) ? -1 : 1, vy: 0, state: 'ground', alive: true, walkT: rand(0, TAU), fallV: 0 });
  }
  bannerText = 'WAVE ' + n;
  bannerSub = pods > 0 ? 'BEWARE THE PODS' : (bombers > 0 ? 'BOMBERS INBOUND' : 'DEFEND THE HUMANOIDS');
  Sound.waveStart();
}

function startNewGame() {
  score = 0; lives = 3; wave = 1; bombs = 3; nextExtra = 15000;
  ship.x = WORLD_W * 0.5; ship.y = (PLAY_TOP + GROUND_BASE) * 0.4; ship.vx = 0; ship.vy = 0; camX = ship.x;
  ship.facing = 1; ship.carrying = null; ship.invuln = 2.5; ship.alive = true;
  spawnWave(wave); state = STATE.INTRO; stateTimer = 2.0;
}

function nextWave() {
  const survivors = humanoids.filter(h => h.alive).length;
  const bonus = survivors * 100;
  if (bonus > 0) { score += bonus; addFloat(ship.x, ship.y - 30, '+' + bonus + ' SURVIVORS', '#7fdfff'); }
  wave++;
  if (wave % 5 === 0 && bombs < 5) { bombs++; addFloat(ship.x, ship.y - 50, 'EXTRA SMART BOMB', '#ffe020'); }
  spawnWave(wave); state = STATE.INTRO; stateTimer = 2.0;
}

// --------------------------- Player actions ------------------------------
function reverseShip(dir) {
  if (state !== STATE.PLAY || !ship.alive) return;
  if (ship.facing !== dir) { ship.facing = dir; Sound.reverse(); }
}
function smartBomb() {
  if (state !== STATE.PLAY || !ship.alive || bombs <= 0) return;
  bombs--;
  const half = W / 2;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (Math.abs(wrapDist(e.x, ship.x)) <= half) {
      explosion(e.x, e.y, COLORS[e.type] || '#fff', 18, 1.4);
      if (e.carrying) { e.carrying.alive = true; e.carrying.state = 'fall'; e.carrying.fallV = 0; }
      handleEnemyDeath(e, false);
      enemies.splice(i, 1);
    }
  }
  eshots.length = 0;
  for (let i = mines.length - 1; i >= 0; i--) {
    if (Math.abs(wrapDist(mines[i].x, ship.x)) <= half) { explosion(mines[i].x, mines[i].y, '#ff9a2a', 14, 1.1); mines.splice(i, 1); }
  }
  flash = 0.55; flashColor = '#ffe040'; screenShake(12); Sound.smartBomb();
  addFloat(ship.x, ship.y - 26, 'SMART BOMB', '#ffe040');
}
function hyperspace() {
  if (state !== STATE.PLAY || !ship.alive) return;
  ship.x = Math.random() * WORLD_W; ship.y = rand(PLAY_TOP + 60, GROUND_BASE - 230);
  camX = ship.x;
  ship.invuln = Math.max(ship.invuln, 1.6); ship.vx = 0; ship.vy = 0;
  explosion(ship.x, ship.y, '#bfefff', 18, 0.8); Sound.hyperspace();
}

// --------------------------- Combat helpers ------------------------------
function handleEnemyDeath(e, byLaser) {
  score += pointsFor(e);
  addFloat(e.x, e.y - 10, '+' + pointsFor(e), COLORS[e.type] || '#fff');
  Sound.explosion(e.type === 'pod' || e.type === 'bomber');
  if (e.carrying) { e.carrying.alive = true; e.carrying.state = 'fall'; e.carrying.fallV = 0; e.carrying.y = e.y + 12; e.carrying = null; }
  if (e.type === 'pod') {
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU; const s = makeEnemy('swarmer', e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 16);
      s.vx = Math.cos(a) * 130; s.vy = Math.sin(a) * 130; enemies.push(s);
    }
    explosion(e.x, e.y, '#e040e0', 28, 1.7);
  } else {
    explosion(e.x, e.y, COLORS[e.type] || '#fff', 15, 1);
  }
  checkExtraLife();
}
function pointsFor(e) {
  switch (e.type) { case 'lander': return 150; case 'mutant': return 150; case 'bomber': return 500; case 'pod': return 1000; case 'swarmer': return 150; case 'baiter': return 1000; }
  return 100;
}
function checkExtraLife() {
  while (score >= nextExtra) { lives++; nextExtra += 15000; addFloat(ship.x, ship.y - 40, 'EXTRA LIFE', '#ffe020'); Sound.extraLife(); }
}
function enemyFire(x, y) {
  const dx = wrapDist(ship.x, x), dy = ship.y - y;
  const ang = Math.atan2(dy, dx) + rand(-0.12, 0.12);
  const sp = 300;
  eshots.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 2.4, color: '#ff2a18' });
  Sound.enemyShot();
}
function dropMine(x, y) { mines.push({ x, y, vx: rand(-30, 30), vy: 26, timer: 4.5, r: 8 }); }

// --------------------------- Update: ship --------------------------------
function updateShip(dt) {
  if (!ship.alive) return;
  // True inertial four-way flight: the arrows add acceleration and releasing
  // them produces a deliberate coast-down instead of an automatic cruise.
  if (keys.left) ship.vx -= H_ACCEL * dt;
  if (keys.right) ship.vx += H_ACCEL * dt;
  if (!keys.left && !keys.right) ship.vx = approach(ship.vx, 0, H_DAMP, dt);
  ship.vx = clamp(ship.vx, -H_MAX, H_MAX);
  if (Math.abs(ship.vx) > 18) ship.facing = ship.vx < 0 ? -1 : 1;

  if (keys.up) ship.vy -= V_ACCEL * dt;
  if (keys.down) ship.vy += V_ACCEL * dt;
  if (!keys.up && !keys.down) ship.vy = approach(ship.vy, 0, V_DAMP, dt);
  ship.vy = clamp(ship.vy, -V_MAX, V_MAX);
  ship.thrust = (keys.left || keys.right ? 1 : 0) + (keys.up || keys.down ? 1 : 0);
  ship.x = wrap(ship.x + ship.vx * dt, WORLD_W);
  ship.y += ship.vy * dt;
  const top = PLAY_TOP + 16;
  const groundY = terrainTop(ship.x) - 12;
  if (ship.y > groundY) { ship.y = groundY; if (ship.vy > 0) ship.vy = 0; }
  if (ship.y < top) { ship.y = top; if (ship.vy < 0) ship.vy = 0; }
  if (ship.invuln > 0) ship.invuln -= dt;

  fireCooldown -= dt;
  if (keys.fire && fireCooldown <= 0) {
    fireCooldown = LASER_RATE;
    shots.push({ x: ship.x + ship.facing * 22, y: ship.y + 1, vx: ship.facing * LASER_SPEED + ship.vx * 0.4, vy: 0, life: 1.1 });
    Sound.laser();
  }
  if (ship.carrying) {
    const h = ship.carrying; h.x = ship.x; h.y = ship.y + 18;
    if (ship.y >= terrainTop(ship.x) - 26) {
      h.state = 'ground'; h.y = terrainTop(h.x) - 11; h.vx = chance(0.5) ? -1 : 1; h.fallV = 0;
      ship.carrying = null; rescuedThisWave++;
      score += 500; addFloat(h.x, h.y - 16, '+500 SAVE', '#7fdfff'); Sound.save();
    }
  }
}

// --------------------------- Update: enemies -----------------------------
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.t += dt;
    const gY = terrainTop(e.x) - 12;

    if (e.type === 'lander') {
      if (e.carrying) {
        e.vy = approach(e.vy, -48, 3, dt); e.vx = approach(e.vx, 0, 2, dt);
      } else {
        if (!e.target || !e.target.alive || e.target.state !== 'ground') {
          let best = null, bd = 9999;
          for (const h of humanoids) { if (h.alive && h.state === 'ground') { const d = Math.abs(wrapDist(h.x, e.x)); if (d < bd) { bd = d; best = h; } } }
          e.target = best;
        }
        if (e.target) {
          const dx = wrapDist(e.target.x, e.x);
          e.vx = approach(e.vx, clamp(dx, -1, 1) * e.speed, 3, dt);
          const wantY = terrainTop(e.target.x) - 42 + Math.sin(e.t * 3 + e.wobble) * 8;
          e.vy = approach(e.vy, clamp(wantY - e.y, -1, 1) * e.speed, 3, dt);
          if (Math.abs(wrapDist(e.target.x, e.x)) < 14 && Math.abs(e.y - (terrainTop(e.target.x) - 30)) < 30) {
            e.carrying = e.target; e.target.state = 'carried-enemy'; e.target.alive = true; e.target = null;
          }
        } else {
          e.vx = approach(e.vx, Math.sin(e.t * 0.7) * e.speed, 2, dt);
          e.vy = approach(e.vy, Math.sin(e.t * 1.6 + e.wobble) * 40, 3, dt);
        }
        e.fireTimer -= dt;
        if (e.fireTimer <= 0 && Math.abs(wrapDist(ship.x, e.x)) < W * 0.55) { e.fireTimer = rand(1.6, 3.0); if (chance(0.5)) enemyFire(e.x, e.y); }
      }
    } else if (e.type === 'mutant') {
      // Aggressive jinking pursuit: weaves toward the player, surges when far away.
      const dx = wrapDist(ship.x, e.x), dy = ship.y - e.y; const d = Math.hypot(dx, dy) || 1;
      const jx = Math.sin(e.t * 6.0 + e.wobble);
      const jy = Math.cos(e.t * 4.7 + e.wobble * 1.3);
      const sp = e.speed * (d > 220 ? 1.18 : 0.92);
      e.vx = approach(e.vx, (dx / d * 0.7 + jx * 0.95) * sp, 5, dt);
      e.vy = approach(e.vy, (dy / d * 0.7 + jy * 0.95) * sp, 5, dt);
      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && Math.abs(wrapDist(ship.x, e.x)) < W * 0.5) { e.fireTimer = rand(0.9, 2.0); if (chance(0.5)) enemyFire(e.x, e.y); }
    } else if (e.type === 'bomber') {
      e.vx = Math.cos(e.t * 0.9 + e.wobble) * e.speed;
      e.vy = Math.sin(e.t * 1.3) * 42;
      e.mineTimer -= dt;
      if (e.mineTimer <= 0) { e.mineTimer = rand(1.6, 3.0); dropMine(e.x, e.y + 14); }
    } else if (e.type === 'pod') {
      const dx = wrapDist(ship.x, e.x), dy = ship.y - e.y; const d = Math.hypot(dx, dy) || 1;
      e.vx = approach(e.vx, (dx / d) * e.speed, 2, dt);
      e.vy = approach(e.vy, (dy / d) * e.speed * 0.6 + Math.sin(e.t * 2) * 30, 2, dt);
    } else if (e.type === 'swarmer') {
      const dx = wrapDist(ship.x, e.x), dy = ship.y - e.y; const d = Math.hypot(dx, dy) || 1;
      e.vx = approach(e.vx, (dx / d) * e.speed + Math.sin(e.t * 10 + e.wobble) * 60, 6, dt);
      e.vy = approach(e.vy, (dy / d) * e.speed + Math.cos(e.t * 11 + e.wobble) * 60, 6, dt);
    } else if (e.type === 'baiter') {
      const dx = wrapDist(ship.x, e.x), dy = ship.y - e.y; const d = Math.hypot(dx, dy) || 1;
      e.vx = approach(e.vx, (dx / d) * e.speed, 3, dt);
      e.vy = approach(e.vy, (dy / d) * e.speed, 3, dt);
      e.fireTimer -= dt;
      if (e.fireTimer <= 0) { e.fireTimer = rand(0.7, 1.3); enemyFire(e.x, e.y); }
    }

    e.x = wrap(e.x + e.vx * dt, WORLD_W); e.y += e.vy * dt;
    if (e.y > gY) { e.y = gY; if (e.vy > 0) e.vy = 0; }
    if (e.y < PLAY_TOP + 24) { e.y = PLAY_TOP + 24; if (e.vy < 0) e.vy = 0; }

    if (e.type === 'lander' && e.carrying && e.y <= PLAY_TOP + 40) {
      const h = e.carrying; h.alive = false; h.state = 'dead'; e.carrying = null;
      e.type = 'mutant'; e.speed = 174 + wave * 9; e.fireTimer = rand(0.8, 1.6); e.r = 13;
      Sound.mutation(); explosion(e.x, e.y, '#ff2a18', 22, 1.3);
      addFloat(e.x, e.y - 16, 'MUTANT!', '#ff2a18');
    }

    if (ship.alive && ship.invuln <= 0) {
      const r = e.r + SHIP_R - 4;
      if (Math.abs(wrapDist(e.x, ship.x)) < r && Math.abs(e.y - ship.y) < r) killPlayer();
    }
  }
}

// --------------------------- Update: humanoids ---------------------------
function updateHumanoids(dt) {
  let alive = 0;
  for (const h of humanoids) {
    if (!h.alive) continue;
    if (h.state === 'ground') {
      alive++;
      h.walkT += dt * 5;
      h.x = wrap(h.x + h.vx * 22 * dt, WORLD_W);
      h.y = terrainTop(h.x) - 11;
      if (chance(0.004)) h.vx = -h.vx;
    } else if (h.state === 'fall') {
      alive++;
      h.fallV += 540 * dt; h.y += h.fallV * dt;
      const gy = terrainTop(h.x) - 11;
      if (h.y >= gy) { h.y = gy; h.fallV = 0; h.state = 'ground'; h.vx = chance(0.5) ? -1 : 1; Sound.land(); }
    } else { alive++; }
  }
  for (const e of enemies) { if (e.carrying) { e.carrying.x = e.x; e.carrying.y = e.y + 16; } }
  if (!planetDestroyed && alive === 0 && state === STATE.PLAY) {
    planetDestroyed = true;
    flash = 0.75; flashColor = '#ff7a3d'; screenShake(16);
    Sound.explosion(true); Sound.mutation();
    addFloat(ship.x, ship.y - 40, 'PLANET DESTROYED', '#ff7a3d');
    for (let i = 0; i < 4 + wave; i++) {
      let x; do { x = Math.random() * WORLD_W; } while (Math.abs(wrapDist(x, ship.x)) < 400);
      enemies.push(makeEnemy('mutant', x, rand(PLAY_TOP + 40, GROUND_BASE - 170)));
    }
  }
}

// --------------------------- Update: projectiles -------------------------
function updateProjectiles(dt) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.x = wrap(s.x + s.vx * dt, WORLD_W); s.y += s.vy * dt; s.life -= dt;
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j]; const r = e.r + 5;
      if (Math.abs(wrapDist(e.x, s.x)) < r && Math.abs(e.y - s.y) < r) {
        handleEnemyDeath(e, true); enemies.splice(j, 1); hit = true; break;
      }
    }
    if (hit || s.life <= 0) { shots.splice(i, 1); continue; }
    for (let j = mines.length - 1; j >= 0; j--) {
      const m = mines[j];
      if (Math.abs(wrapDist(m.x, s.x)) < m.r + 4 && Math.abs(m.y - s.y) < m.r + 4) {
        explosion(m.x, m.y, '#ff9a2a', 12, 1); mines.splice(j, 1); shots.splice(i, 1); break;
      }
    }
  }
  for (let i = eshots.length - 1; i >= 0; i--) {
    const s = eshots[i];
    s.x = wrap(s.x + s.vx * dt, WORLD_W); s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.y > terrainTop(s.x) - 2 || s.y < PLAY_TOP) { eshots.splice(i, 1); continue; }
    if (ship.alive && ship.invuln <= 0 && Math.abs(wrapDist(s.x, ship.x)) < SHIP_R && Math.abs(s.y - ship.y) < SHIP_R) {
      eshots.splice(i, 1); killPlayer(); continue;
    }
    for (const h of humanoids) {
      if (h.alive && (h.state === 'ground' || h.state === 'fall') && Math.abs(wrapDist(s.x, h.x)) < 12 && Math.abs(s.y - h.y) < 14) {
        h.alive = false; h.state = 'dead'; explosion(h.x, h.y, '#7fdfff', 10); eshots.splice(i, 1); break;
      }
    }
  }
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    m.x = wrap(m.x + m.vx * dt, WORLD_W); m.y += m.vy * dt; m.timer -= dt;
    if (m.y > terrainTop(m.x) - 6 || m.timer <= 0) {
      explosion(m.x, m.y, '#ff9a2a', 16, 1.1); Sound.explosion(false); mines.splice(i, 1);
      if (ship.alive && ship.invuln <= 0 && Math.abs(wrapDist(m.x, ship.x)) < 46 && Math.abs(m.y - ship.y) < 46) killPlayer();
      continue;
    }
    if (ship.alive && ship.invuln <= 0 && Math.abs(wrapDist(m.x, ship.x)) < m.r + SHIP_R - 4 && Math.abs(m.y - ship.y) < m.r + SHIP_R - 4) {
      explosion(m.x, m.y, '#ff9a2a', 16, 1.1); mines.splice(i, 1); killPlayer();
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.ring) { p.r += dt * p.maxr * 3.2; }
    else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.y -= 26 * dt; f.life -= dt; if (f.life <= 0) floats.splice(i, 1); }
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.6);
}

function killPlayer() {
  if (!ship.alive || ship.invuln > 0) return;
  ship.alive = false;
  playerExplosion(ship.x, ship.y);
  Sound.death(); screenShake(16); flash = 0.18; flashColor = '#dfffff';
  if (ship.carrying) { const h = ship.carrying; h.state = 'fall'; h.fallV = -60; h.alive = true; ship.carrying = null; }
  lives--; state = STATE.DEAD; stateTimer = 1.6;
}

function updateWaveLogic(dt) {
  waveTime += dt;
  const hasBaiter = enemies.some(e => e.type === 'baiter');
  const baiterThreshold = Math.max(14, 26 - wave * 1.5);
  if (waveTime > baiterThreshold && !hasBaiter) {
    let x; do { x = Math.random() * WORLD_W; } while (Math.abs(wrapDist(x, ship.x)) < 300);
    enemies.push(makeEnemy('baiter', x, rand(PLAY_TOP + 40, GROUND_BASE - 170)));
    Sound.baiter(); addFloat(ship.x, ship.y - 40, 'BAITER!', '#ff4848');
  }
  if (enemies.length === 0) nextWave();
}

function togglePause() {
  if (state === STATE.PLAY) state = 'pause';
  else if (state === 'pause') state = STATE.PLAY;
}
function confirm() {
  Sound.resume(); Sound.init();
  if (state === STATE.TITLE || state === STATE.GAMEOVER) startNewGame();
  else if (state === STATE.INTRO) state = STATE.PLAY;
}

function update(dt) {
  updateParticles(dt);
  if (state === STATE.TITLE) { for (const s of stars) s.tw += dt; return; }
  if (state === STATE.INTRO) { stateTimer -= dt; for (const s of stars) s.tw += dt; if (stateTimer <= 0) state = STATE.PLAY; return; }
  if (state === 'pause') return;
  if (state === STATE.GAMEOVER) { for (const s of stars) s.tw += dt; return; }
  if (state === STATE.DEAD) {
    stateTimer -= dt;
    updateEnemies(dt); updateProjectiles(dt); updateHumanoids(dt);
    if (stateTimer <= 0) {
      if (lives <= 0) {
        if (score > hi) { hi = score; try { localStorage.setItem('defenderHi', String(hi)); } catch(e){} }
        state = STATE.GAMEOVER;
      } else {
        ship.x = WORLD_W * 0.5; ship.y = (PLAY_TOP + GROUND_BASE) * 0.4;
        camX = ship.x;
        ship.vx = 0; ship.vy = 0; ship.invuln = 2.6; ship.alive = true;
        state = STATE.PLAY;
      }
    }
    return;
  }
  for (const s of stars) s.tw += dt;
  updateShip(dt); updateCamera(dt); updateEnemies(dt); updateHumanoids(dt); updateProjectiles(dt); updateWaveLogic(dt);
  if (ship.alive && !ship.carrying) {
    for (const h of humanoids) {
      if (h.alive && h.state === 'fall' && Math.abs(wrapDist(h.x, ship.x)) < 20 && Math.abs(h.y - (ship.y + 14)) < 22) {
        h.state = 'carried-player'; ship.carrying = h;
        score += 100; addFloat(h.x, h.y - 14, '+100', '#7fdfff'); Sound.pickup(); break;
      }
    }
  }
}

// =========================================================================
//                              RENDERING
// =========================================================================
function updateCamera(dt) {
  // Let the ship roam through most of the viewport before scrolling the world.
  // This fixes the old coordinate bug that drew the ship at exactly x = W.
  const margin = Math.min(W * 0.34, Math.max(24, W * 0.18));
  const left = margin, right = W - margin;
  const sx = W / 2 + wrapDist(ship.x, camX);
  let target = camX;
  if (sx < left) target = wrap(ship.x + W / 2 - left, WORLD_W);
  else if (sx > right) target = wrap(ship.x + W / 2 - right, WORLD_W);
  const d = wrapDist(target, camX);
  camX = wrap(camX + d * Math.min(1, 7 * dt), WORLD_W);
}
function cameraX() { return camX; }
function drawX(wx) { return W / 2 + wrapDist(wx, cameraX()); }
function neon(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur == null ? 10 : blur; }
function neonOff() { ctx.shadowBlur = 0; }

function drawStars() {
  neonOff();
  for (const s of stars) {
    const x = drawX(s.x);
    if (x < -4 || x > W + 4) continue;
    const tw = 0.6 + 0.4 * Math.sin(s.tw * 3 + s.tw);
    ctx.globalAlpha = s.b * tw;
    ctx.fillStyle = s.b > 0.8 ? '#d6ecff' : '#5f7396';
    ctx.fillRect(x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

function drawTerrain() {
  const cam = cameraX(); const step = 5;
  ctx.beginPath(); ctx.moveTo(0, GROUND_BASE + 6);
  for (let sx = 0; sx <= W; sx += step) ctx.lineTo(sx, terrainTop(cam + sx));
  ctx.lineTo(W, GROUND_BASE + 6); ctx.closePath();
  const g = ctx.createLinearGradient(0, GROUND_BASE - 200, 0, GROUND_BASE);
  if (planetDestroyed) { g.addColorStop(0, '#3a1a12'); g.addColorStop(1, '#0a0404'); }
  else { g.addColorStop(0, '#0c5a1c'); g.addColorStop(0.5, '#073d14'); g.addColorStop(1, '#021a09'); }
  ctx.fillStyle = g; ctx.fill();
  // luminous top edge
  ctx.beginPath();
  for (let sx = 0; sx <= W; sx += step) { const y = terrainTop(cam + sx); if (sx === 0) ctx.moveTo(sx, y); else ctx.lineTo(sx, y); }
  neon(planetDestroyed ? '#ff7a3d' : '#5dff3a', 10);
  ctx.strokeStyle = planetDestroyed ? '#ff9a5a' : '#9aff48'; ctx.lineWidth = 2.2; ctx.stroke();
  neonOff();
}

function drawShip() {
  if (!ship.alive) return;
  if (ship.invuln > 0 && Math.floor(ship.invuln * 12) % 2 === 0) return;
  const x = drawX(ship.x), y = ship.y, f = ship.facing;
  ctx.save(); ctx.translate(x, y); ctx.scale(f, 1);
  // main thrust flame
  const fl = 9 + Math.random() * 11 + ship.thrust * 6;
  neon('#ffb24d', 14); ctx.fillStyle = Math.random() < 0.5 ? '#ffd24d' : '#fff0a0';
  ctx.beginPath(); ctx.moveTo(-14, -3); ctx.lineTo(-14 - fl, 0); ctx.lineTo(-14, 3); ctx.closePath(); ctx.fill();
  if (keys.up || keys.down) {
    neon('#bfefff', 10); ctx.fillStyle = '#dffaff'; const vf = 7 + Math.random() * 7;
    if (keys.up) { ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(-4 - vf * 0.4, -12 - vf); ctx.lineTo(1, -9); ctx.closePath(); ctx.fill(); }
    if (keys.down) { ctx.beginPath(); ctx.moveTo(-4, 8); ctx.lineTo(-4 - vf * 0.4, 12 + vf); ctx.lineTo(1, 9); ctx.closePath(); ctx.fill(); }
  }
  // hull — reads white
  neon('#bfefff', 12); ctx.fillStyle = '#0b2a33'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(6, -4); ctx.lineTo(-2, -10); ctx.lineTo(-12, -9); ctx.lineTo(-12, -2);
  ctx.lineTo(-15, 0); ctx.lineTo(-12, 2); ctx.lineTo(-12, 9); ctx.lineTo(-2, 10); ctx.lineTo(6, 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(-2, 4); ctx.stroke();
  neon('#ffffff', 8); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(9, 0, 3.6, 2.6, 0, 0, TAU); ctx.fill();
  neonOff();
  if (ship.carrying) { ctx.strokeStyle = '#8ff0ff'; ctx.lineWidth = 1; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(0, 14, 9, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
  ctx.restore();
}

function drawHumanoid(h) {
  if (!h.alive) return;
  if (h.state === 'carried-player' || h.state === 'carried-enemy') return;
  const x = drawX(h.x);
  if (x < -20 || x > W + 20) return;
  ctx.save(); ctx.translate(x, h.y);
  neon('#3fd8ff', 6); ctx.strokeStyle = '#8ff0ff'; ctx.lineWidth = 2;
  const sw = h.state === 'ground' ? Math.sin(h.walkT) * 2 : 0;
  ctx.strokeRect(-1.5, -12, 3, 3);
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(-3, -4); ctx.moveTo(0, -7); ctx.lineTo(3, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(-2 + sw, 1); ctx.moveTo(0, -3); ctx.lineTo(2 - sw, 1); ctx.stroke();
  neonOff(); ctx.restore();
}

function drawEnemy(e) {
  const x = drawX(e.x);
  if (x < -44 || x > W + 44) return;
  const y = e.y;
  ctx.save(); ctx.translate(x, y);
  const col = COLORS[e.type];
  neon(col, 10);

  if (e.type === 'lander') {
    const leg = Math.sin(e.t * 6) * 2;
    ctx.strokeStyle = col; ctx.fillStyle = '#0e2e10'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-9, 6); ctx.lineTo(-9, -4); ctx.quadraticCurveTo(-9, -11, 0, -11); ctx.quadraticCurveTo(9, -11, 9, -4); ctx.lineTo(9, 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, -15); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, -15, 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#eaffd0'; ctx.fillRect(-5, -5, 3, 3); ctx.fillRect(2, -5, 3, 3);
    ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(-7, 6); ctx.lineTo(-11, 11 + leg); ctx.lineTo(-13, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, 6); ctx.lineTo(11, 11 - leg); ctx.lineTo(13, 12); ctx.stroke();
  } else if (e.type === 'mutant') {
    // The arcade mutant is a compact, radial alien — not a bird or a winged ship.
    // Hard-edged pixel blocks keep the silhouette close to the low-resolution source.
    const phase = Math.floor(e.t * 10) % 3;
    const magenta = phase === 1 ? '#ff46df' : '#f020d0';
    const pink = '#ff9bec';
    const green = phase === 2 ? '#caff3c' : '#61ff20';
    const lime = '#eaff55';
    const orange = '#ffb52d';
    const p = (px, py, color, pw, ph) => {
      ctx.fillStyle = color;
      ctx.fillRect(px, py, pw || 3, ph || 3);
    };
    ctx.shadowColor = magenta; ctx.shadowBlur = 6;

    // Dark pixel underlay separates the compact alien from the black field.
    p(-4, -8, '#190019', 8, 16);
    p(-8, -4, '#190019', 16, 8);

    // Eight short radial prongs. Their small phase shift is the animation.
    const twitch = phase === 1 ? 1 : 0;
    p(-2, -12, green, 4, 3); p(-8, -10, green, 4, 3); p(4, -10, green, 4, 3);
    p(-13, -5 - twitch, green, 4, 3); p(9, -5 + twitch, green, 4, 3);
    p(-13, 3 + twitch, green, 4, 3); p(9, 3 - twitch, green, 4, 3);
    p(-8, 7, green, 4, 3); p(4, 7, green, 4, 3); p(-2, 10, green, 4, 3);
    p(-9, -7, lime, 3, 3); p(6, -7, lime, 3, 3); p(-9, 4, lime, 3, 3); p(6, 4, lime, 3, 3);

    // Bright magenta core with a hot orange/yellow center.
    p(-3, -7, magenta, 6, 14); p(-7, -3, magenta, 14, 6);
    p(-2, -9, pink, 4, 3); p(-2, 6, pink, 4, 3);
    p(-2, -2, orange, 4, 4); p(-1, -1, '#fff06a', 2, 2);
  } else if (e.type === 'bomber') {
    const ef = e.vx >= 0 ? 1 : -1; ctx.scale(ef, 1);
    ctx.strokeStyle = col; ctx.fillStyle = '#3a3008'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(13, 0); ctx.lineTo(2, -8); ctx.lineTo(-10, -6); ctx.lineTo(-6, 0); ctx.lineTo(-10, 6); ctx.lineTo(2, 8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    neon('#fff8b0', 8); ctx.fillStyle = '#fff8b0'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(-16, -10); ctx.moveTo(-10, 6); ctx.lineTo(-16, 10); ctx.stroke();
  } else if (e.type === 'pod') {
    const pts = [[-7, -3], [7, -3], [0, -9], [-8, 5], [8, 5], [0, 8], [0, 0]];
    neon(col, 12); ctx.fillStyle = '#2a0a2a'; ctx.strokeStyle = col; ctx.lineWidth = 2;
    for (const p of pts) { ctx.beginPath(); ctx.arc(p[0], p[1], 7, 0, TAU); ctx.fill(); ctx.stroke(); }
    neon('#f0b0f0', 8); ctx.fillStyle = '#f0b0f0';
    for (const p of pts) { ctx.beginPath(); ctx.arc(p[0] - 1.5, p[1] - 1.5, 1.7, 0, TAU); ctx.fill(); }
  } else if (e.type === 'swarmer') {
    ctx.fillStyle = col; neon(col, 8);
    const a = e.t * 10;
    ctx.beginPath(); ctx.ellipse(0, 0, 4, 2.5, a, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-1, -1, 2, 2);
  } else if (e.type === 'baiter') {
    const ef = e.vx >= 0 ? 1 : -1; ctx.scale(ef, 1);
    ctx.strokeStyle = col; ctx.fillStyle = '#330808'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-3, -7); ctx.lineTo(12, 0); ctx.lineTo(-3, 7); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd0d0'; ctx.fillRect(2, -2, 4, 4);
  }
  if (e.carrying) { ctx.fillStyle = '#8ff0ff'; ctx.fillRect(-2, 16, 4, 8); }
  neonOff(); ctx.restore();
}

function drawShots() {
  neonOff(); ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const s of shots) {
    const x = drawX(s.x); if (x < -18 || x > W + 18) continue;
    neon('#fff7a0', 10); ctx.strokeStyle = '#fffce0';
    ctx.beginPath(); ctx.moveTo(x, s.y); ctx.lineTo(x - Math.sign(s.vx) * 20, s.y); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, s.y, 1.8, 0, TAU); ctx.fill();
  }
  neonOff();
  for (const s of eshots) {
    const x = drawX(s.x); if (x < -10 || x > W + 10) continue;
    neon('#ff2a18', 8); ctx.fillStyle = '#ff8060'; ctx.beginPath(); ctx.arc(x, s.y, 3, 0, TAU); ctx.fill();
  }
  neonOff();
  for (const m of mines) {
    const x = drawX(m.x); if (x < -10 || x > W + 10) continue;
    const blink = Math.floor(m.timer * 6) % 2 === 0;
    neon(blink ? '#ffe020' : '#ff9a2a', 10); ctx.fillStyle = blink ? '#fff0a0' : '#ff9a2a';
    ctx.beginPath(); ctx.arc(x, m.y, m.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }
  neonOff(); ctx.lineCap = 'butt';
}

function drawParticles() {
  neonOff();
  for (const p of particles) {
    if (p.ring) {
      const x = drawX(p.x); if (x < -80 || x > W + 80) continue;
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.85;
      neon(p.color, 10); ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, TAU); ctx.stroke(); neonOff();
      continue;
    }
    const x = drawX(p.x); if (x < -10 || x > W + 10) continue;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
    ctx.fillRect(x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 14px "Courier New", monospace'; ctx.textAlign = 'center';
  for (const f of floats) {
    const x = drawX(f.x); if (x < -40 || x > W + 40) continue;
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1); neon(f.color, 6); ctx.fillStyle = f.color;
    ctx.fillText(f.text, x, f.y);
  }
  ctx.globalAlpha = 1; neonOff(); ctx.textAlign = 'left';
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(0, 0, W, HUD_H);
  neon('#1c6f7f', 6); ctx.strokeStyle = '#2fd0c0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke(); neonOff();

  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  neon('#7fdfff', 6); ctx.fillStyle = '#cffaff';
  ctx.fillText('SCORE ' + String(score).padStart(6, '0'), 14, HUD_H / 2);
  ctx.fillStyle = '#9fe9ff'; ctx.fillText('HI ' + String(hi).padStart(6, '0'), 240, HUD_H / 2);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe020'; neon('#ffe020', 6);
  ctx.fillText('WAVE ' + wave, W / 2, HUD_H / 2);
  ctx.textAlign = 'right';
  for (let i = 0; i < lives; i++) {
    const lx = W - 14 - i * 26, ly = HUD_H / 2;
    neon('#bfefff', 6); ctx.fillStyle = '#0b2a33'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(lx + 9, ly); ctx.lineTo(lx - 6, ly - 6); ctx.lineTo(lx - 6, ly + 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  neonOff();
  ctx.textAlign = 'right'; ctx.fillStyle = '#9affd0'; neon('#9affd0', 6);
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText('◆ BOMB x' + bombs, W - 14 - lives * 26 - 12, HUD_H / 2);
  neonOff(); ctx.textBaseline = 'alphabetic';
}

function drawScanner() {
  const top = H - SCANNER_H;
  ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fillRect(0, top, W, SCANNER_H);
  neon('#1c6f55', 6); ctx.strokeStyle = '#27d08a'; ctx.lineWidth = 1;
  ctx.strokeRect(4, top + 4, W - 8, SCANNER_H - 8); neonOff();
  ctx.strokeStyle = 'rgba(40,200,140,0.18)';
  for (let i = 1; i < 8; i++) { const gx = 4 + (W - 8) * (i / 8); ctx.beginPath(); ctx.moveTo(gx, top + 4); ctx.lineTo(gx, top + SCANNER_H - 4); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(4, top + SCANNER_H / 2); ctx.lineTo(W - 4, top + SCANNER_H / 2); ctx.stroke();
  const sx = (wx) => 4 + ((wx % WORLD_W) / WORLD_W) * (W - 8);
  const midY = top + SCANNER_H / 2;
  ctx.strokeStyle = '#1f7f6a'; ctx.beginPath();
  for (let i = 0; i <= W - 8; i += 4) {
    const wx = (i / (W - 8)) * WORLD_W; const ty = terrainTop(wx);
    const ny = top + SCANNER_H - 8 - (GROUND_BASE - ty) / 178 * 16;
    if (i === 0) ctx.moveTo(4 + i, ny); else ctx.lineTo(4 + i, ny);
  }
  ctx.stroke();
  for (const h of humanoids) { if (!h.alive) continue; ctx.fillStyle = h.state === 'carried-enemy' ? '#ff2a18' : '#7fdfff'; ctx.fillRect(sx(h.x) - 1, midY - 1, 2, 2); }
  for (const e of enemies) {
    ctx.fillStyle = COLORS[e.type];
    const r = e.type === 'pod' ? 3 : (e.type === 'swarmer' ? 1.4 : 2.2);
    ctx.beginPath(); ctx.arc(sx(e.x), midY, r, 0, TAU); ctx.fill();
  }
  const px = sx(ship.x);
  ctx.fillStyle = '#fff'; neon('#fff', 6);
  ctx.beginPath(); ctx.moveTo(px + 6, midY); ctx.lineTo(px - 4, midY - 4); ctx.lineTo(px - 4, midY + 4); ctx.closePath(); ctx.fill();
  neonOff();
  ctx.font = 'bold 11px "Courier New", monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#27d08a';
  ctx.fillText('SCANNER', 10, top + 16);
  ctx.textAlign = 'right'; ctx.fillText('M:MUTE  P:PAUSE  F:FULL', W - 10, top + 16);
}

function drawTextC(text, x, y, size, color, align, glow) {
  ctx.font = 'bold ' + size + 'px "Courier New", monospace';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  neon(color, glow == null ? 14 : glow); ctx.fillStyle = color; ctx.fillText(text, x, y); neonOff();
  ctx.textBaseline = 'alphabetic';
}

function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, 0, W, H);
  const cy = H / 2;
  drawTextC('DEFENDER', W / 2, cy - 150, Math.min(78, W / 11), '#7fdfff', 'center', 22);
  drawTextC('an arcade tribute to the 1981 classic', W / 2, cy - 104, 14, '#5fbfd0', 'center', 6);
  ctx.textAlign = 'left';
  const lines = [
    ['← / →', 'accelerate left / right  (inertial flight)'],
    ['↑ / ↓', 'accelerate up / down  (inertial flight)'],
    ['SPACE', 'fire laser'],
    ['B', 'smart bomb  (clears the screen)'],
    ['H', 'hyperspace  (teleport + brief shield)'],
    ['P', 'pause      M : mute      F : fullscreen']
  ];
  const px = W / 2 - 230; let py = cy - 60;
  ctx.font = 'bold 15px "Courier New", monospace';
  for (const [k, d] of lines) {
    neon('#9affd0', 4); ctx.fillStyle = '#9affd0'; ctx.fillText(k, px, py);
    neonOff(); ctx.fillStyle = '#bfe9ef'; ctx.fillText(d, px + 96, py);
    py += 26;
  }
  ctx.textAlign = 'center';
  drawTextC('Protect the humanoids. Shoot the landers before they mutate.', W / 2, cy + 130, 14, '#ffe020', 'center', 4);
  if (Math.floor(performance.now() / 500) % 2 === 0)
    drawTextC('PRESS  ENTER  OR  CLICK  TO  START', W / 2, cy + 180, 20, '#fff', 'center', 12);
  drawTextC('HIGH SCORE  ' + String(hi).padStart(6, '0'), W / 2, H - 130, 14, '#5fbfd0', 'center', 4);
}

function drawBanner() {
  const a = clamp(stateTimer, 0, 0.6) / 0.6;
  ctx.globalAlpha = a;
  drawTextC(bannerText, W / 2, H / 2 - 30, 48, '#fff', 'center', 18);
  drawTextC(bannerSub, W / 2, H / 2 + 14, 18, '#ffe020', 'center', 6);
  ctx.globalAlpha = 1;
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  drawTextC('PAUSED', W / 2, H / 2 - 10, 48, '#7fdfff', 'center', 16);
  drawTextC('press P to resume', W / 2, H / 2 + 30, 16, '#bfe9ef', 'center', 4);
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  drawTextC('GAME OVER', W / 2, H / 2 - 60, 56, '#ff2a18', 'center', 18);
  drawTextC('SCORE  ' + String(score).padStart(6, '0'), W / 2, H / 2, 22, '#fff', 'center', 8);
  drawTextC('HIGH   ' + String(hi).padStart(6, '0'), W / 2, H / 2 + 30, 18, '#ffe020', 'center', 6);
  drawTextC('REACHED WAVE ' + wave, W / 2, H / 2 + 60, 16, '#bfe9ef', 'center', 4);
  if (Math.floor(performance.now() / 500) % 2 === 0)
    drawTextC('PRESS  ENTER  TO  PLAY  AGAIN', W / 2, H / 2 + 110, 18, '#7fdfff', 'center', 8);
}

function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawStars(); drawTerrain();
  for (const h of humanoids) drawHumanoid(h);
  drawShots();
  for (const e of enemies) drawEnemy(e);
  drawShip();
  drawParticles();
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = clamp(flash, 0, 1) * 0.5; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHUD(); drawScanner();
  if (state === STATE.TITLE) drawTitle();
  else if (state === STATE.INTRO) drawBanner();
  else if (state === STATE.GAMEOVER) drawGameOver();
  else if (state === 'pause') drawPause();
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt); render();
  requestAnimationFrame(frame);
}

resize();
ship.y = (PLAY_TOP + GROUND_BASE) * 0.4;
requestAnimationFrame(frame);
</script>
</body>
</html>
